<input type="hidden" id="txtTitle" th:value="${title}"/>
<div class="card">
  <div class="card-body">
    <form th:action="@{/question3/update}" id="frmEditPelajaran" method="post">
      <input type="text" name="id" id="txtId" th:value="${pelajaran.id}"/>
      <!-- Optionally, include an updateBy hidden field if required -->
      <div class="form-group">
        <label for="txtName" class="form-label h6"> Name </label>
        <input type="text" class="form-control" id="txtName" name="name" th:value="${pelajaran.name}" />
      </div>
      <div class="form-group">
        <label for="txtCode" class="form-label"> Code </label>
        <input type="text" class="form-control" id="txtCode" name="code" th:value="${pelajaran.code}" />
      </div>
      <div class="text-right">
        <button class="btn btn-success mt-3"><i class="fas fa-edit"></i> Update</button>
      </div>
    </form>
  </div>
</div>

<script>
  $(document).ready(function () {
    $("#staticModalLabel").text($("#txtTitle").val());

    $("#frmEditPelajaran").validate({
      rules: {
        name: {
          required: true,
          maxlength: 100,
          minlength: 3
        },
        code: {
          required: true,
          maxlength: 50
        }
      },
      errorClass: "text-danger"
    });

    $("#frmEditPelajaran").submit(function(e) {
      e.preventDefault();

      if ($("#frmEditPelajaran").valid()){
        $.ajax({
          url: "/question3/update",
          type: "post",
          data: $("#frmEditPelajaran").serialize(),
          dataType: "json",
          
          success: function(response) {
            alert("Pelajaran " + response.name + " successfully updated!");
            location.reload();
          },
          error: function(errResponse) {
            console.error("Update pelajaran failed: " + errResponse.responseText);
          }
        });
      }
    });
  });
</script>
