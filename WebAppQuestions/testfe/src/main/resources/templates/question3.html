<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Question 3 (Pelajaran Management)</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center">
            <span class="h1">Pelajaran Management</span>
        </div>
        <hr />

        <!-- Input Section for New Pelajaran -->
        <div class="mb-3">
            <div class="row g-2">
                <div class="col-md-6">
                    <label for="txtName" class="form-label">Name:</label>
                    <input type="text" id="txtName" name="name" class="form-control" placeholder="Enter Name" />
                </div>
                <div class="col-md-6">
                    <label for="txtCode" class="form-label">Code:</label>
                    <input type="text" id="txtCode" name="code" class="form-control" placeholder="Enter Code" />
                </div>
            </div>
            <div class="mt-2">
                <button id="btnSave" class="btn btn-success">Save</button>
            </div>
        </div>

        <!-- Table for Pelajaran -->
        <div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Name</th>
                        <th>Code</th>
                    </tr>
                </thead>
                <tbody th:if="${pelajaran != null}">
                    <tr th:each="item : ${pelajaran}">
                        <td>
                            <div class="btn-group">
                                <button th:data-id="${item.id}" class="btn btn-success btn-sm">Edit</button>
                                <button th:data-id="${item.id}" class="btn btn-warning btn-sm">
                                    <span class="text-white">View</span>
                                </button>
                            </div>
                        </td>
                        <td th:text="${item.name}">Name</td>
                        <td th:text="${item.code}">Code</td>
                    </tr>
                </tbody>
            </table>
            <div th:unless="${pelajaran != null}" th:text="${errorMsg}" class="text h6 text-danger text-center"></div>
        </div>

        <!-- JavaScript Section -->
        <script>
            $(document).ready(function () {
                // Save button click handler
                $("#btnSave").click(function (e) {
                    e.preventDefault();
                    var name = $("#txtName").val();
                    var code = $("#txtCode").val();
                    console.log("Save clicked with Name: " + name + " and Code: " + code);
                    // You can perform an AJAX POST to save the new Pelajaran here, for example:
                    // $.post('/pelajaran/create', {name: name, code: code}, function(response){
                    //     // handle response, refresh table, etc.
                    // });
                });

                // Edit button click handler
                $(".btn-success").click(function (e) {
                    let id = $(this).data("id");
                    $("#staticModalBody").load("pelajaran/edit/" + id);
                    $("#staticModal").modal("show");
                });

                // View button click handler
                $(".btn-warning").click(function (e) {
                    let id = $(this).data("id");
                    $("#staticModalBody").load("pelajaran/" + id);
                    $("#staticModal").modal("show");
                });
            });
        </script>
    </div>
</body>
</html>
