<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Question 3 (Pelajaran Management)</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center">
            <span class="h1">Question 3 (Pelajaran Management)</span>
            <div>
                <button type="button" id="btnAdd" class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#staticModal">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
        <hr />

        <!-- Input Section for New Pelajaran -->
        <div class="mb-4">
            <form id="frmNewPelajaran">
                <div class="row g-2">
                    <div class="col-md-6">
                        <label for="txtName" class="form-label">Name:</label>
                        <input type="text" id="txtName" name="name" class="form-control" placeholder="Enter Name" />
                    </div>
                    <div class="col-md-6">
                        <label for="txtCode" class="form-label">Code:</label>
                        <input type="text" id="txtCode" name="code" class="form-control" placeholder="Enter Code" />
                    </div>
                </div>
                <div class="mt-2 text-end">
                    <button id="btnSave" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>

        <!-- Table Section for Existing Pelajaran -->
        <div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Name</th>
                        <th>Code</th>
                    </tr>
                </thead>
                <tbody th:if="${pelajaran != null}">
                    <tr th:each="item : ${pelajaran}">
                        <td>
                            <div class="btn-group">
                                <button type="button" th:data-id="${item.id}" class="btn btn-success btn-edit btn-sm">Edit</button>
                                <button type="button" th:data-id="${item.id}" class="btn btn-warning btn-view btn-sm">
                                    <span class="text-white">View</span>
                                </button>
                                <button type="button" th:data-id="${item.id}" class="btn btn-danger btn-delete btn-sm">Delete</button>
                            </div>
                        </td>
                        <td th:text="${item.name}">Name</td>
                        <td th:text="${item.code}">Code</td>
                    </tr>
                </tbody>
            </table>
            <div th:unless="${pelajaran != null}" th:text="${errorMsg}" class="text h6 text-danger text-center"></div>
        </div>

        <!-- JavaScript Section -->
        <script>
            $(document).ready(function(){
                // Validate new Pelajaran form to ensure no empty inputs
                $("#frmNewPelajaran").validate({
                    rules: {
                        name: { required: true },
                        code: { required: true }
                    },
                    errorClass: "text-danger"
                });

                // Save button click handler (for creating new Pelajaran)
                $("#btnSave").click(function(e) {
                    e.preventDefault();
                    if($("#frmNewPelajaran").valid()){
                        var name = $("#txtName").val();
                        var code = $("#txtCode").val();
                        console.log("Save clicked with Name: " + name + " and Code: " + code);
                        
                        $.ajax({
                            url: "/question3/create",
                            type: "post",
                            data: { name: name, code: code },
                            dataType: "json",
                            success: function(response) {
                                alert("Pelajaran " + response.name + " successfully created!");
                                location.reload();
                            },
                            error: function(errResponse) {
                                console.error("Create new Pelajaran Failed: " + errResponse.responseText);
                            }
                        });
                    }
                });

                // Edit button click handler - loads the edit form into the modal and shows it
                $(".btn-edit").click(function(e) {
                    let id = $(this).data("id");
                    $("#staticModalBody").load("/question3/edit/" + id, function() {
                        $("#staticModal").modal("show");
                    });
                });

                // View button click handler - loads the details view into the modal and shows it
                $(".btn-view").click(function(e) {
                    let id = $(this).data("id");
                    $("#staticModalBody").load("/question3/" + id, function() {
                        $("#staticModal").modal("show");
                    });
                });

                // Delete button click handler - confirms deletion then calls the delete endpoint
                $(".btn-delete").click(function(e) {
                    if(!confirm("Are you sure you want to delete this Pelajaran?")) return;
                    let id = $(this).data("id");
                    $.ajax({
                        url: "/question3/delete/" + id,
                        type: "post",
                        dataType: "json",
                        success: function(response) {
                            alert("Pelajaran deleted successfully!");
                            location.reload();
                        },
                        error: function(errResponse) {
                            console.error("Delete Pelajaran Failed: " + errResponse.responseText);
                        }
                    });
                });

                // Add button click handler - loads the add form into the modal
                $("#btnAdd").click(function(e) {
                    $("#staticModalBody").load("/pelajaran/add", function() {
                        $("#staticModal").modal("show");
                    });
                });
            });
        </script>
    </div>
</body>
</html>
