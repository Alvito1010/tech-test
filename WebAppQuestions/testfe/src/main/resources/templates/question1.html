<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{fragments/layout}">

<head>
    <title>Question 1 (Pageable Data Table)</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Question 1 (Pageable Data Table)</h1>

            <!-- Page Size Dropdown -->
            <div class="d-flex align-items-center">
                <label class="me-2">Page Size:</label>
                <select class="form-select form-select-sm w-auto" id="pageSize" name="currPageSize">
                    <option th:each="i : ${#numbers.sequence(5, 20, 5)}" th:value="${i}" th:text="${i}" th:selected="${i == currPageSize}"></option>
                </select>
            </div>
        </div>

        <table class="table table-striped table-hover table-bordered text-center">
            <thead>
                <tr>
                    <th class="col-2">ID</th>
                    <th class="col-6">Name</th>
                    <th class="col-4">Provinsi ID</th>
                </tr>
            </thead>
            <tbody th:if="${kota != null}">
                <tr th:each="item : ${kota.getContent}">
                    <td class="col-2" th:text="${item.id}"></td>
                    <td class="col-6 text-start" th:text="${item.name}"></td>
                    <td class="col-4" th:text="${item.provinsiId}"></td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination Controls -->
        <div class="d-flex justify-content-center">
            <div class="btn-group">
                <button id="btnPrev" class="btn btn-secondary" th:disabled="${kota.first}"><<</button>
                <span class="input-group-text">Page <span th:text="${kota.number + 1}" class="mx-2"></span> of <span th:text="${kota.totalPages}" class="mx-2"></span></span>
                <button id="btnNext" class="btn btn-secondary" th:disabled="${kota.last}">>></button>
            </div>
        </div>

        <script>
            $(document).ready(function () {
                // Change Page Size
                $("#pageSize").change(function () {
                    let newSize = $(this).val();
                    location.href = `/question1?pageNumber=0&currPageSize=${newSize}`;
                });

                // Pagination
                $("#btnPrev").click(function () {
                    let currPageSize = $("#pageSize").val();
                    let pageNumber = parseInt([[${kota.number}]]) - 1;
                    location.href = `/question1?pageNumber=${pageNumber}&currPageSize=${currPageSize}`;
                });

                $("#btnNext").click(function () {
                    let currPageSize = $("#pageSize").val();
                    let pageNumber = parseInt([[${kota.number}]]) + 1;
                    location.href = `/question1?pageNumber=${pageNumber}&currPageSize=${currPageSize}`;
                });
            });
        </script>
    </div>
</body>

</html>
